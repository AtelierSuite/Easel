<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The pencil, its tip split from the body by a small gap. The page and stroke
    are separate layers so Icon Composer can give each its own opacity in every
    appearance; drawn in white because Icon Composer tints and lights each layer.
  -->
  <g fill="#FFFFFF" transform="translate(512 512) scale(0.92) translate(-522 -530) translate(528 560) rotate(-45)">
    <path d="M0 0L104 -50V50Z"/>
    <rect x="120" y="-50" width="360" height="100" rx="26"/>
  </g>
</svg>
