<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    The page the pencil draws on, anchored to the bottom left so the pencil can
    reach out past its top right corner. Every layer shares the same transform,
    which fits the whole drawing into the same margins as the Tables icon.
  -->
  <g transform="translate(512 512) scale(0.92) translate(-522 -530)">
    <rect x="196" y="308" width="520" height="520" rx="80" fill="#FFFFFF"/>
  </g>
</svg>
